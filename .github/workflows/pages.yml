name: Deploy site to Pages

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# 배포는 한 번에 하나만. 진행 중인 배포를 취소하면 사이트가 중간 상태로 남을 수 있으므로 취소하지 않는다.
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'deploy' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true   # Gemfile.lock 기준으로 설치 + 캐시

      - name: Build
        run: bundle exec jekyll build
        env:
          # utterances 댓글은 jekyll.environment == 'production' 일 때만 렌더된다.
          # 클래식 빌드는 이 값을 자동으로 넣어줬지만 Actions 빌드에서는 직접 넣어야 한다.
          JEKYLL_ENV: production

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
